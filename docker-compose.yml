
services:
  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}"
      APP_DB_USER: "${APP_DB_USER:?APP_DB_USER is required}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./day18/init/00-create-app-role.sh:/docker-entrypoint-initdb.d/00-create-app-role.sh:ro
      - ./day18/init/01-extension.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
      - ./day18/init/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./day18/init/03-metadata.sql:/docker-entrypoint-initdb.d/03-metadata.sql:ro
      - ./day18/init/04-authentication.sql:/docker-entrypoint-initdb.d/04-authentication.sql:ro
      - ./day18/init/05-grants.sql:/docker-entrypoint-initdb.d/05-grants.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - day18_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fde-hr:${APP_IMAGE_TAG:-day18-v1}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      EMPLOYEE_API_KEY: "${EMPLOYEE_API_KEY:?EMPLOYEE_API_KEY is required}"
      HR_API_KEY: "${HR_API_KEY:?HR_API_KEY is required}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text:latest}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-qwen3.5:2b}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - hr_uploads:/app/data/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - day18_network

  agent:
    build:
      context: ./day12-agent/langgraph_lab
      dockerfile: Dockerfile
    image: fde-agent:${AGENT_IMAGE_TAG:-day18-v1}
    restart: unless-stopped
    init: true
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      LLM_MODEL: "${LLM_MODEL:-qwen3.5:2b}"
      LLM_API_KEY: "${LLM_API_KEY:-ollama}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - day18_network

  ingest:
    image: fde-hr:${APP_IMAGE_TAG:-day18-v1}
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text:latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - -c
      - "from src.ingestion import ingest_directory; count = ingest_directory('/app/data/hr_policies', tenant_id='main', allowed_roles=['employee', 'HR administrator']); print(f'Inserted {count} policy chunks')"
    networks:
      - day18_network

  proxy:
    build:
      context: ./day18/caddy
      dockerfile: Dockerfile
    image: fde-caddy:${CADDY_IMAGE_TAG:-day18-v1}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - day18_network

volumes:
  postgres_data:
  hr_uploads:
  caddy_data:
  caddy_config:

networks:
  day18_network:
    driver: bridge
