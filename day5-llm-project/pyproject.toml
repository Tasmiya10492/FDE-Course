[project]
name = "day5-llm-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"cv_extractor/experiments.py" = ["T201"]
"multimodal/convert_pdf.py" = ["T201"]
"multimodal/invoice_extractor.py" = ["T201"]
