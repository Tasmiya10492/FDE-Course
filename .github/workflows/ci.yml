# Third-party GitHub Actions are pinned to verified commit SHAs.
# Container images are pinned to verified release tags and image digests.
# This prevents moving tags from silently changing the code used by CI.

name: ci
on: [pull_request]

permissions:
  contents: read            # least privilege for the token the workflow receives

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked
      - run: uv run ruff format --check app tests
      - run: uv run ruff check app tests
      - run: uv run pyright app tests
      - run: uv run pytest
      - run: uv run bandit -r app
      - run: uv run pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose /repo

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --tag "fde-service:${{ github.sha }}" .
